# =============================================================================
# CI Pipeline – AuctionSystem
# Chạy tự động khi: push lên main/develop, hoặc tạo Pull Request vào main
# =============================================================================
name: CI

on:
  push:
    branches: [ "main", "develop", "ServerClient" ]
    paths:
      - "AuctionSystem/**"          # Chỉ trigger khi code Java thay đổi
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "AuctionSystem/**"

jobs:
  # ===========================================================================
  # JOB 1: Build & Unit Tests (không cần DB)
  # ===========================================================================
  unit-tests:
    name: "Build & Unit Tests (Java 21)"
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài Java 21 LTS
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'        # Eclipse Temurin (OpenJDK)
          cache: maven                   # Cache ~/.m2 để build nhanh hơn

      # 3. Build và chạy unit tests (exclude @Tag("integration"))
      - name: Run unit tests
        working-directory: AuctionSystem
        run: mvn test --batch-mode --no-transfer-progress

      # 4. Upload JaCoCo coverage report (luôn chạy, kể cả khi test fail)
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: AuctionSystem/target/site/jacoco/
          retention-days: 14

      # 5. Upload Surefire test reports (để xem chi tiết lỗi nếu có)
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: AuctionSystem/target/surefire-reports/

  # ===========================================================================
  # JOB 2: Integration Tests (cần MySQL) – chỉ chạy khi push lên main
  # ===========================================================================
  integration-tests:
    name: "Integration Tests (MySQL)"
    runs-on: ubuntu-latest
    # Chỉ chạy khi push lên main (không chạy cho mọi PR để tiết kiệm time)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: auction_system_test
          MYSQL_USER: team4
          MYSQL_PASSWORD: team4pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Chờ MySQL sẵn sàng và tạo schema
      - name: Initialize database schema
        run: |
          mysql -h 127.0.0.1 -u team4 -pteam4pass auction_system_test < AuctionSystem/src/test/resources/schema-test.sql

      # Override database.properties để trỏ tới MySQL container trong CI
      - name: Configure test database connection
        working-directory: AuctionSystem/src/test/resources
        run: |
          cat > database.properties << EOF
          db.url=jdbc:mysql://127.0.0.1:3306/auction_system_test?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
          db.username=team4
          db.password=team4pass
          db.poolSize=5
          db.connectionTimeout=30000
          db.idleTimeout=600000
          db.maxLifetime=1800000
          EOF

      # Chạy CHỈ integration tests
      - name: Run integration tests
        working-directory: AuctionSystem
        run: mvn test --batch-mode --no-transfer-progress -Dgroups=integration
