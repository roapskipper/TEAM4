name: CD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Publish Docker & Package Client
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Chuyển tên Repository thành chữ thường để đặt tên Docker Image hợp lệ
      - name: Set image name to lowercase
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. Đăng nhập vào GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Build và Push Docker Image cho Backend Server lên GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./AuctionSystem
          file: ./AuctionSystem/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}/auction-server:latest
            ghcr.io/${{ env.IMAGE_NAME }}/auction-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. Đóng gói ứng dụng JavaFX Client
      - name: Package JavaFX Client
        working-directory: AuctionSystem
        run: |
          mvn clean package -DskipTests -Pcross-platform
          cd target
          zip -r ../../AuctionSpace-Client-${{ github.ref_name }}.zip AuctionSystem-1.0-SNAPSHOT.jar dependency/

      # 8. Tạo GitHub Release và tải lên tệp zip của Client
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: AuctionSpace-Client-${{ github.ref_name }}.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## Bản phát hành ${{ github.ref_name }} - AuctionSpace
            
            ### Hướng dẫn cài đặt và sử dụng:
            1. **JavaFX Client**:
               - Tải tệp tin `AuctionSpace-Client-${{ github.ref_name }}.zip` bên dưới.
               - Giải nén tệp tin ra máy tính cá nhân.
               - Mở Terminal/Command Prompt tại thư mục giải nén và khởi chạy Client bằng lệnh tương ứng với hệ điều hành:
                 - **Windows**:
                   ```cmd
                   java -cp "AuctionSystem-1.0-SNAPSHOT.jar;dependency/*" com.team4.Launcher
                   ```
                 - **macOS / Linux**:
                   ```bash
                   java -cp "AuctionSystem-1.0-SNAPSHOT.jar:dependency/*" com.team4.Launcher
                   ```
               - Hoặc click chạy file JAR tương thích.
            
            2. **Docker Server**:
               - Kéo Docker Image chính thức: `docker pull ghcr.io/${{ env.IMAGE_NAME }}/auction-server:latest`
               - Hoặc sử dụng tệp `docker-compose.yml` có sẵn tại thư mục gốc và chạy lệnh `docker compose up -d` để khởi động đồng bộ Server và Database.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
